prefix: bt
claim_ttl_hours: 24
blocked_nag_days: 14
board_path: BOARD.md
repos:
  capacity-engine: /home/omri/projects/capacity-engine
  # bt-d5e2 (2026-08-23): this board's GIT_* pre-push-scrub finding was fixed
  # in donefile itself (hooks/pre-push.sh is donefile's shared template, not
  # bass-tuner's own code), so the closing evidence commit resolves here.
  # Same cross-repo-evidence need as donefile's own dn-a23f/dn-42b4 aliases.
  donefile: /home/omri/projects/donefile
  # bt-8e12 (2026-08-15): this board files follow-ups whose fix belongs in
  # ~/meni (DOMAIN.md is the domain registry; bt-5149 dropped `albumclub`
  # from scripts/audit-domains.sh here and the matching registry row lives
  # there). Workers are barred from committing to omrihefez/meni, so those
  # land as Main's commits in a repo this board otherwise cannot resolve —
  # and the evidence was real but uncitable, so the task would have had to
  # close bare. Same need, same fix as donefile's dn-a23f.
  meni: /home/omri/meni
# bt-a60b (2026-08-05): bass-tuner is a deployed Vercel PWA (vercel.json,
# .vercel project link, manifest.json, sw.js) whose CI already reasons about
# the deploy surface (check-sw-cache-bump.js, test/vercel-headers.test.js) -
# but activation.tags was empty, so `donefile done` on ANY bt task closed
# straight to done on a bare commit, same done-is-not-deployed gap meniapp
# gates via [hub, plugin, frontend] and meni-arch gates via [feature, design,
# content, a11y, auth, security, deploy, deps, ops]. That matters more here
# than on most boards: a service-worker app has two distinct ways to be
# committed-but-not-live - the deploy never happened, or it happened and
# clients are still served the old cached shell because sw.js's CACHE key
# did not move. check-sw-cache-bump.js already catches the second failure
# mode at COMMIT time; nothing checked it against what's actually live until
# deploy/activation-probes/probe-bt-5fb7.sh, added alongside this gate.
#
# Named here: every tag under which real user-facing app-surface work (the
# static HTML/CSS/JS, manifest.json, sw.js, or vercel.json's headers/
# redirects that Vercel actually serves) ships - audited against every task
# this board has closed so far. Tags NOT listed (ops, monitoring, tls, ci,
# tooling, donefile, docs, tests, safety, audit, infra, config,
# capacity-engine, from-brief, flaky-test, dedup, decision, coverage,
# cleanup, hygiene, process) are repo/process/cron-script bookkeeping with no
# Vercel-served output. Per meniapp's ma-dffe rule, a task under one of THOSE
# tags that turns out to touch the deployed surface anyway still isn't
# silently exempt - it closes via `--waive "<reason>"` rather than a faked
# --live probe, same as a gated task with no runtime surface does. `vercel`
# is listed even though roughly half its historical uses are TLS/DNS/
# project-wiring tasks with no served-content change (bt-03ea, bt-2b10,
# bt-78e6) - those close the same way, via --waive, rather than splitting
# the tag in two.
activation:
  tags: [pwa, ux, correctness, security, deploy, feature, perf, a11y, vercel]
# Activation command: none to run by hand - this Vercel project IS
# git-integrated (unlike meni-arch, whose ar-fe07 note documents its project
# as NOT git-integrated), so a push to origin/main auto-deploys to production
# within ~1-2 min. Confirm with `vercel ls bass-tuner` (Age column) or
# `vercel inspect bass.omrihefez.com`. There's no separate preview/promote
# step like meni-arch's two-step flow: production is what a pushed commit
# becomes.
#
# Live probe: hit the real served site, never a re-read of the diff or the
# local repo file (same bar as meniapp's deploy/activation-probes/README.md,
# ma-f2db) - e.g. curl the live page/asset and assert on its content/headers,
# or for a cached-asset change, diff sw.js's live CACHE version against the
# source commit's (deploy/activation-probes/probe-bt-5fb7.sh). Probe
# convention + index: deploy/activation-probes/README.md.
worktree_guard: true
