name: CI

# paths-ignore: the capacity engine's bookkeeping commits (`engine: ...`,
# `board: ...`) only ever touch .donefile/** and BOARD.md, no code — same
# unfiltered exposure that caused an account-wide Actions outage from the
# fleet's own push volume (th-419e), fixed the same way on meniapp/
# capacity-engine already (ma-ce6e).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - ".donefile/**"
      - "BOARD.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".donefile/**"
      - "BOARD.md"

# Least-privilege default: none of these jobs writes to the repo, comments on
# PRs, or touches packages/releases (ma-70b2 / iac-1dda).
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: JS syntax check
        run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do
            node --check "$f" || exit 1
          done

      - name: HTML validate
        run: npx --yes html-validate@8.29.0 *.html

      - name: Internal link + manifest check
        run: node scripts/check-links.js

      - name: sw.js cache-bump check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/check-sw-cache-bump.js

      - name: Unit tests
        run: npm test
